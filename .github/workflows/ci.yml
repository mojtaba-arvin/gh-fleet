name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          gofmt -d .
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Verify Go module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Python SDK tests
        run: PYTHONPATH=integrations/python/src python3 -m unittest discover -s integrations/python/tests -v
      - name: Commit identity policy self-tests
        run: python3 scripts/check_commit_identity.py --self-test
      - name: Build current platform
        run: go build ./...
      - name: Build release targets
        env:
          CGO_ENABLED: '0'
        run: |
          for target in 'darwin amd64' 'darwin arm64' 'linux amd64' 'linux arm64' 'windows amd64' 'windows arm64'; do
            set -- $target
            GOOS=$1 GOARCH=$2 go build -o /dev/null ./...
          done

  validate-pr-attribution:
    name: PR commit attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate policy fixtures
        run: python3 scripts/check_commit_identity.py --self-test
      - name: Validate every pull request commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_commit_identity.py
